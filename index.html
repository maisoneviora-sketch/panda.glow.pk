<style>

:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.pgc-win{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(max(16px,env(safe-area-inset-bottom)) + 74px);width:380px;height:min(600px,calc(var(--pgc-vh,100vh) - 110px));display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--beige);border-radius:24px;box-shadow:0 18px 50px rgba(74,46,34,.28);z-index:10;overflow:hidden;font:15px/1.45 system-ui,sans-serif;opacity:0;transform:translateY(14px) scale(.97);visibility:hidden;pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s}
.pgc-win.on{opacity:1;transform:none;visibility:visible;pointer-events:auto}
.pgc-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(135deg,var(--pink),var(--beige))}

.pgc-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;overscroll-behavior:contain}
.pgc-m{max-width:86%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.pgc-m time{display:block;font-size:11px;opacity:.65;margin-top:2px}
.pgc-m.u{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
.pgc-m.b{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.pgc-m.e{align-self:flex-start;background:var(--beige);border-bottom-left-radius:6px}
.pgc-chips{display:flex;flex-wrap:wrap;gap:6px}.pgc-chips button,.pgc-act button{border:1px solid var(--accent);background:var(--card);color:var(--brown);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.pgc-act{background:var(--card);border:1px dashed var(--accent);border-radius:16px;padding:10px;align-self:stretch}.pgc-act p{margin:0 0 8px}.pgc-act button:first-of-type{background:var(--accent);color:#fff;margin-right:6px}.pgc-act button:disabled{opacity:.5;cursor:default}
.pgc-cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;align-self:stretch}
.pgc-c{flex:0 0 150px;scroll-snap-align:start;background:var(--card);border-radius:16px;padding:8px;box-shadow:var(--shadow);font-size:13px}
.pgc-c img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--beige)}.pgc-c b{display:block;margin:4px 0 2px;line-height:1.25}.pgc-c s{color:var(--muted);margin-left:4px}.pgc-c small{color:var(--muted)}
.pgc-c div{display:flex;gap:4px;margin-top:6px}.pgc-c button{flex:1;border:0;border-radius:999px;padding:6px 4px;cursor:pointer;background:var(--beige);color:var(--brown);font-size:12px}.pgc-c button.p{background:var(--accent);color:#fff}.pgc-c button:disabled{opacity:.45;cursor:default}
.pgc-dots{align-self:flex-start;background:var(--card);box-shadow:var(--shadow);border-radius:18px;padding:12px 14px;display:flex;gap:4px}.pgc-dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pgcDot 1s infinite}.pgc-dots i:nth-child(2){animation-delay:.15s}.pgc-dots i:nth-child(3){animation-delay:.3s}
@keyframes pgcDot{50%{transform:translateY(-4px);opacity:.5}}
.pgc-form{display:flex;gap:6px;align-items:flex-end;padding:8px 10px;border-top:1px solid var(--beige);background:var(--card)}
.pgc-win textarea{flex:1;margin:0;resize:none;max-height:110px;border-radius:18px;padding:9px 12px}
.pgc-send{background:var(--accent);color:#fff;width:42px;height:42px}.pgc-send:disabled{opacity:.5;cursor:default}
.pgc-note{font-size:11px;color:var(--muted);text-align:center;padding:0 10px 6px;background:var(--card)}
@media(max-width:600px){.pgc-win{left:8px;right:8px;width:auto;bottom:max(8px,env(safe-area-inset-bottom));height:min(82vh,calc(var(--pgc-vh,100vh) - 16px))}.pgc-open .pgc-fab{display:none}.pgc-win textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){.pgc-fab::after,.pgc-dots i{animation:none}.pgc-win,.pgc-fab{transition:none}.pgc-log{scroll-behavior:auto}}
</style></head><body>

 delivery:{fee:100,freeOver:5000}};

const DB={mode:cfgOK?'firebase':'demo',
 async init(){if(FB)return FB;if(!cfgOK)throw new Error('Firebase configuration is incomplete');const u=m=>import('https://www.gstatic.com/firebasejs/10.12.2/firebase-'+m+'.js');const[a,fs]=await Promise.all([u('app'),u('firestore')]);let app;try{app=a.getApp()}catch{app=a.initializeApp(FIREBASE_CONFIG)}
  /* auto long-polling fixes writes that hang forever on networks that block Firestore's default streaming connection */

 /* Firebase Authentication: the admin signs in with a real Firebase account so Firestore/Storage rules can recognise them */

 async products(){if(!FB||!FB.db)return null;try{const q=await tmo(FB.getDocs(FB.collection(FB.db,'products')),12000,'Product loading timed out');const r=q.docs.map(d=>norm({id:d.id,...d.data()}));r.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));cacheP(r);return r}catch(e){console.warn('Firebase products could not be read. Check Firestore setup/rules and hosting.',e);return null} },
 async placeOrder(o){
  if(!cfgOK||this.mode==='demo')throw new Error('The store database is not configured, so this order was not saved.');

home(){const best=P.filter(p=>p.badge=='best'),nw=P.filter(p=>p.badge=='new');return `<section class="hero"><div><h1 style="font-size:clamp(28px,6vw,46px)">${BRAND.tagline}</h1><p>Bring cozy vibes and adorable lighting into your everyday life.</p><a class="btn" href="#/shop">Shop Now</a></div><img src="${esc(BRAND.heroImage||P[0]?.img||lampSVG('#fff','#f8c8d4'))}" alt="Panda lamp"></section>

<section class="hero" style="text-align:center;display:block"><h2>Make Your Room Magical ✨</h2><p>Soft light, sweet shapes, instant cozy.</p><a class="btn alt" href="#/shop">Explore lamps</a></section>

/* ===== ADMIN ACTIONS ===== */
/* Turn Firebase error codes into clear, actionable messages */
function authMsg(e){const c=e&&e.code||'';
 if(c==='app/not-admin')return `Signed in as ${e.email}, but your Firestore rules do not list this account as admin. In Firebase Console → Firestore → Rules, set the admin UID to: ${e.uid}`;
 if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c))return 'Incorrect email or password.';
 if(c==='auth/invalid-email')return 'That email address is not valid.';
 if(c==='auth/user-disabled')return 'This admin account has been disabled in Firebase.';
 if(c==='auth/too-many-requests')return 'Too many attempts. Wait a few minutes, then try again.';
 if(c==='auth/network-request-failed')return 'Network error. Check your internet connection and try again.';
 if(c==='auth/operation-not-allowed')return 'Email/Password sign-in is not enabled. Firebase Console → Authentication → Sign-in method → enable Email/Password.';
 return 'Login failed: '+(e&&e.message||'unknown error');}
function fbMsg(e,what){const c=e&&e.code||'',m=e&&e.message||'';
 if(c==='permission-denied')return AD.user?`Firestore rules are blocking this ${what}. You are signed in as ${AD.user.email}, but this account is not the admin in your rules. In Firebase Console → Firestore → Rules, set the admin UID to: ${AD.user.uid}`:`Firestore rules are blocking this ${what} because you are not signed in as admin. Log out and log in again.`;
 if(c==='unauthenticated')return 'Your admin session has expired. Log out, log in again, then retry.';
 if(c==='not-found')return 'This product no longer exists in the database. Refresh the page and try again.';
 if(c==='invalid-argument')return 'Firebase rejected the data: '+m;
 if(c==='resource-exhausted')return 'Firebase quota or size limit reached. Remove a picture or try again later.';
 if(c==='unavailable'||c==='deadline-exceeded')return 'Cannot reach Firebase. Check your internet connection and try again.';
 return `Could not ${what}: ${m||c||'unknown error'}`;}
